# WinDays Web - Nginx Configuration
# Domain: days.winroad.org
# Type:   React PWA（Vite ビルドの静的配信・SPA フォールバック）
# Root:   /var/www/WinDays/web/build   （bash deploy/web-reflect.sh で dist → build に反映）
# API:    api.days.winroad.org（別 vhost。WinTask リポジトリ deploy/nginx/api.days.winroad.org.conf）

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name days.winroad.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/WinDays/web/build;
        allow all;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name days.winroad.org;

    ssl_certificate /etc/letsencrypt/live/days.winroad.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/days.winroad.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/days.winroad.org/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_windaysweb:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/days.winroad.org-access.log combined;
    error_log  /var/log/nginx/days.winroad.org-error.log warn;

    root /var/www/WinDays/web/build;
    index index.html;

    charset utf-8;
    client_max_body_size 1M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # アプリシェル・Service Worker・マニフェストは常に最新を取得（再デプロイの即時反映）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ハッシュ付きアセットは長期キャッシュ
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA フォールバック
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
